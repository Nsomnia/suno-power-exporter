<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Suno Library</title>
<style>
/* ==========================================================================
 * Suno Master Utility — side panel
 * --------------------------------------------------------------------------
 * The side panel is a NORMAL extension page, so unlike `content/content.css`
 * (which is shadow-root only and must never touch the page's :root) this file
 * is free to style `body` directly. The palette is the same one the dock uses
 * so the panel and the on-page UI read as one product:
 * --sm-purple #8b5cf6, --sm-accent #22d3ee, --sm-ok #34d399, --sm-bad #f87171.
 * ========================================================================== */

:root {
  --sm-bg: #0d101a;
  --sm-panel: #151a28;
  --sm-panel-2: #1b2133;
  --sm-border: rgba(255, 255, 255, 0.13);
  --sm-border-2: rgba(255, 255, 255, 0.26);
  --sm-text: #eef2ff;
  --sm-muted: #9aa4bf;
  --sm-purple: #8b5cf6;
  --sm-purple-2: #6366f1;
  --sm-accent: #22d3ee;
  --sm-ok: #34d399;
  --sm-bad: #f87171;
  --sm-warn: #fbbf24;
  --sm-focus: #22d3ee;
}

@media (prefers-color-scheme: light) {
  :root {
    --sm-bg: #f4f5fa;
    --sm-panel: #ffffff;
    --sm-panel-2: #eef0f7;
    --sm-border: rgba(15, 20, 40, 0.15);
    --sm-border-2: rgba(15, 20, 40, 0.34);
    --sm-text: #16192a;
    --sm-muted: #5b6379;
    --sm-purple: #6d28d9;
    --sm-purple-2: #4f46e5;
    --sm-accent: #0e7490;
    --sm-ok: #047857;
    --sm-bad: #b91c1c;
    --sm-warn: #a16207;
    --sm-focus: #6d28d9;
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  padding: 10px 10px 24px;
  background: var(--sm-bg);
  color: var(--sm-text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 13px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

/* ------------------------------------------------------------------ head */
.sp-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}

.sp-title {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin: 0;
  font-size: 13px;
  font-weight: 700;
}

.sp-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--sm-purple);
  box-shadow: 0 0 10px var(--sm-purple);
  flex: none;
}

.sp-h2 {
  margin: 0;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--sm-muted);
}

/* --------------------------------------------------------------- banners */
.sp-banner {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin: 0 0 8px;
  padding: 7px 9px;
  border-radius: 8px;
  border: 1px solid var(--sm-warn);
  background: color-mix(in srgb, var(--sm-warn) 14%, var(--sm-panel));
  font-size: 11.5px;
}
.sp-banner-title { font-weight: 700; color: var(--sm-warn); }

.sp-alert {
  margin: 0 0 8px;
  padding: 7px 9px;
  border-radius: 8px;
  border: 1px solid var(--sm-bad);
  background: color-mix(in srgb, var(--sm-bad) 12%, var(--sm-panel));
  color: var(--sm-text);
  font-size: 11.5px;
}

/* ---------------------------------------------------------------- search */
.sp-controls {
  display: flex;
  gap: 6px;
  margin-bottom: 7px;
}

.sp-search {
  flex: 1 1 auto;
  min-width: 0;
  font: inherit;
  font-size: 13px;
  color: var(--sm-text);
  background: var(--sm-panel);
  border: 1px solid var(--sm-border-2);
  border-radius: 7px;
  padding: 6px 9px;
  min-height: 30px;
}

.sp-sort {
  flex: none;
  width: 116px;
  font: inherit;
  font-size: 12px;
  color: var(--sm-text);
  background: var(--sm-panel);
  border: 1px solid var(--sm-border-2);
  border-radius: 7px;
  padding: 5px 6px;
  min-height: 30px;
}

.sp-count {
  margin: 0 0 8px;
  font-size: 11px;
  color: var(--sm-muted);
}

.sp-facets {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin: 0 0 9px;
  padding: 0;
  list-style: none;
}

.sp-facet {
  padding: 2px 7px;
  border-radius: 999px;
  border: 1px solid var(--sm-border);
  background: var(--sm-panel);
  font-size: 10.5px;
  color: var(--sm-muted);
}
.sp-facet b { color: var(--sm-text); font-weight: 700; }

/* ------------------------------------------------------------------ rows */
.sp-list { margin: 0; padding: 0; list-style: none; }

.sp-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 7px 8px;
  margin-bottom: 4px;
  border: 1px solid var(--sm-border);
  border-radius: 8px;
  background: var(--sm-panel);
}
.sp-row:hover { background: var(--sm-panel-2); }

.sp-body { flex: 1 1 auto; min-width: 0; }

.sp-title-row {
  display: flex;
  align-items: baseline;
  gap: 5px;
}

.sp-name {
  font-size: 12.5px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}

.sp-badge {
  flex: none;
  padding: 0 5px;
  border-radius: 999px;
  border: 1px solid var(--sm-border-2);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.3px;
  color: var(--sm-muted);
  white-space: nowrap;
}

.sp-dots { display: inline-flex; gap: 3px; flex: none; }

.sp-dotmark {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex: none;
}
.sp-dotmark.is-liked { background: var(--sm-ok); }
.sp-dotmark.is-disliked { background: var(--sm-bad); }

.sp-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 2px;
  font-size: 10.5px;
  color: var(--sm-muted);
}
.sp-meta span { overflow-wrap: anywhere; }
.sp-sep { opacity: 0.5; }

.sp-note {
  margin-top: 2px;
  font-size: 10.5px;
  color: var(--sm-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sp-note.is-bad { color: var(--sm-bad); }
.sp-note.is-ok { color: var(--sm-ok); }

/* --------------------------------------------------------------- buttons */
.sp-dl {
  flex: none;
  appearance: none;
  font: inherit;
  font-size: 11px;
  font-weight: 600;
  min-width: 62px;
  min-height: 26px;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid transparent;
  background: var(--sm-purple);
  color: #fff;
  cursor: pointer;
}
.sp-dl:hover:not(:disabled) { background: var(--sm-purple-2); }
.sp-dl:disabled { opacity: 0.5; cursor: not-allowed; }
.sp-dl.is-ok { background: transparent; border-color: var(--sm-ok); color: var(--sm-ok); }
.sp-dl.is-bad { background: transparent; border-color: var(--sm-bad); color: var(--sm-bad); }

.sp-more {
  display: block;
  width: 100%;
  appearance: none;
  font: inherit;
  font-size: 12px;
  font-weight: 600;
  min-height: 30px;
  margin-top: 6px;
  border-radius: 8px;
  border: 1px solid var(--sm-border-2);
  background: var(--sm-panel);
  color: var(--sm-text);
  cursor: pointer;
}
.sp-more:hover:not(:disabled) { background: var(--sm-purple); border-color: var(--sm-purple); color: #fff; }
.sp-more:disabled { opacity: 0.5; cursor: not-allowed; }

.sp-empty {
  margin: 0;
  padding: 14px 10px;
  border: 1px dashed var(--sm-border-2);
  border-radius: 8px;
  text-align: center;
  font-size: 12px;
  color: var(--sm-muted);
}

:focus-visible {
  outline: 2px solid var(--sm-focus);
  outline-offset: 2px;
}

.sp-live {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}
</style>
</head>
<body>

<header class="sp-head">
  <h1 class="sp-title"><span class="sp-dot" aria-hidden="true"></span>My Library</h1>
  <h2 class="sp-h2" id="sp-count">loading&hellip;</h2>
</header>

<div id="sp-truncated" class="sp-banner" role="alert" hidden>
  <span class="sp-banner-title">Library incomplete</span>
  <span id="sp-truncated-text">The last sync hit its page cap, so some clips are missing from this index.</span>
</div>

<div id="sp-error" class="sp-alert" role="alert" hidden></div>

<div class="sp-controls">
  <label class="sp-live" for="sp-search">Search clips by title, style, prompt or model</label>
  <input id="sp-search" class="sp-search" type="search" autocomplete="off" spellcheck="false"
         placeholder="Search titles, styles, prompts&hellip;"
         aria-describedby="sp-search-h">
  <label class="sp-live" for="sp-sort">Sort clips</label>
  <select id="sp-sort" class="sp-sort" aria-describedby="sp-search-h">
    <option value="newest">Newest first</option>
    <option value="oldest">Oldest first</option>
    <option value="title">Title A&ndash;Z</option>
    <option value="plays">Most played</option>
    <option value="upvotes">Most liked</option>
    <option value="duration">Longest</option>
  </select>
</div>
<p id="sp-search-h" class="sp-live">Results are paged 50 at a time from the local index; searching does not re-read storage.</p>

<ul id="sp-facets" class="sp-facets" aria-label="Library totals"></ul>

<p id="sp-status" class="sp-count" role="status" aria-live="polite">&nbsp;</p>

<ul id="sp-list" class="sp-list" aria-label="Clips"></ul>

<button id="sp-more" class="sp-more" type="button" hidden aria-label="Load the next 50 clips">Load more</button>

<div id="sp-announce" class="sp-live" role="status" aria-live="polite"></div>

<script src="side_panel.js"></script>
</body>
</html>
